<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL Shortener</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-icon">U</div>
          <div>
            <p class="eyebrow">URL Platform</p>
            <h1>Shortly</h1>
          </div>
        </div>
        <button id="logoutBtn" class="secondary hidden">Logout</button>
      </header>

      <main>
        <section id="authView" class="auth-view">
          <div class="auth-card">
            <div class="auth-header">
              <p class="eyebrow">Welcome back</p>
              <h2>Manage links in seconds</h2>
            </div>

            <div class="tab-switcher" role="tablist" aria-label="Authentication tabs">
              <button class="tab active" data-tab="login" type="button">Login</button>
              <button class="tab" data-tab="register" type="button">Register</button>
            </div>

            <form id="authForm" class="auth-form">
              <div class="field">
                <label for="emailInput">Email</label>
                <input id="emailInput" name="email" type="email" placeholder="you@example.com" required />
              </div>

              <div class="field">
                <label for="passwordInput">Password</label>
                <input id="passwordInput" name="password" type="password" placeholder="••••••••" required />
              </div>

              <button class="primary" type="submit" id="authSubmitBtn">Login</button>
              <p id="authMessage" class="message"></p>
            </form>
          </div>
        </section>

        <section id="dashboardView" class="dashboard hidden">
          <aside class="sidebar card">
            <div>
              <p class="eyebrow">Overview</p>
              <h3>Your dashboard</h3>
            </div>

            <div class="stats-box">
              <span>Total links</span>
              <strong id="totalLinks">0</strong>
            </div>

            <div class="stats-box accent">
              <span>Total clicks</span>
              <strong id="totalClicks">0</strong>
            </div>
          </aside>

          <div class="content-panel">
            <div class="card create-card">
              <div class="section-heading">
                <div>
                  <p class="eyebrow">Create link</p>
                  <h3>Shorten a URL</h3>
                </div>
              </div>

              <form id="urlForm" class="url-form">
                <div class="field wide">
                  <label for="originalUrlInput">Long URL</label>
                  <input id="originalUrlInput" name="url" type="url" placeholder="https://example.com/very-long-link" required />
                </div>

                <div class="field-row">
                  <div class="field">
                    <label for="customAliasInput">Custom alias</label>
                    <input id="customAliasInput" name="customAlias" type="text" placeholder="my-link" />
                  </div>

                  <div class="field">
                    <label for="expiresAtInput">Expiry date</label>
                    <input id="expiresAtInput" name="expiresAt" type="datetime-local" />
                  </div>
                </div>

                <button class="primary" type="submit">Create Short URL</button>
                <p id="urlMessage" class="message"></p>
              </form>
            </div>

            <div class="card list-card">
              <div class="section-heading">
                <div>
                  <p class="eyebrow">Links</p>
                  <h3>Recent URLs</h3>
                </div>
              </div>
              <div id="urlList" class="url-list"></div>
            </div>
          </div>

          <aside class="details-panel card">
            <div>
              <p class="eyebrow">Analytics</p>
              <h3>Selected link</h3>
            </div>

            <div id="statsPanel" class="stats-panel empty">
              <p>Select a link to view performance.</p>
            </div>
          </aside>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
